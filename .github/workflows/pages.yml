name: Verify and deploy Centre Court
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verified_kira:
        description: Publish the completed, already-tested Kira d3e0c5e build
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Manual publication reuses the committed acceptance results for this exact ref.
      # Ordinary production pushes retain the complete verification suite.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_kira && 'd3e0c5ec0ee80f608b8c5847d46212a41ec7ebbc' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.verified_kira }}
        run: npm test
      - run: npm run build
      # Azure's HTTP mirror stalled two browser-setup attempts. Preserve Ubuntu's
      # signed repository configuration and use its official HTTPS mirrors.
      - name: Use official Ubuntu package mirrors
        if: ${{ !inputs.verified_kira }}
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt
          fi
      - if: ${{ !inputs.verified_kira }}
        run: npx playwright install --with-deps chromium webkit
      - if: ${{ !inputs.verified_kira }}
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
